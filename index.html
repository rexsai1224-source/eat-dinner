<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今天晚餐吃什麼 - 第15組牧場像素廚房</title>
<style>
:root{
  --cream:#fdf6e7;--parchment:#f4e6c8;--parchment-dark:#e5cfa4;
  --olive-light:#c8b48a;--olive:#8c744c;--ink:#422718;--ink-soft:#75543e;
  --orange:#e67e28;--red:#d94a3f;--green:#529e44;--blue:#4b83b5;--purple:#7e4aa8;
  --font:"PingFang TC","Microsoft JhengHei","Noto Sans TC",monospace,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background-color:#d4b48c;
  background-image:
    repeating-linear-gradient(0deg,rgba(66,39,24,.07) 0 2px,transparent 2px 26px),
    repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 4px,transparent 4px 60px);
  font-family:var(--font);color:var(--ink);padding:8px;
}
button{font-family:var(--font);cursor:pointer;color:var(--ink);font-weight:800}
button:disabled{cursor:not-allowed;opacity:.5}
.px-art{display:block;image-rendering:pixelated;image-rendering:crisp-edges}

/* 可愛圓潤 16-bit 掌機外殼（手機單欄 / 電腦雙欄自適應） */
.phone{
  position:relative;width:404px;max-width:100%;height:min(820px,calc(100vh - 16px));min-height:680px;
  background:var(--cream);border:4px solid var(--ink);border-radius:20px;
  box-shadow:0 0 0 4px var(--olive-light),0 0 0 8px var(--ink),10px 12px 0 6px rgba(66,39,24,.32);
  display:flex;flex-direction:column;overflow:hidden;transition:width .25s ease;
}
.bezel{
  height:24px;background:var(--parchment-dark);border-bottom:3px solid var(--ink);
  display:flex;align-items:center;justify-content:space-between;padding:0 14px;
  font-size:10px;font-weight:900;letter-spacing:.8px;color:var(--ink-soft);
}
.bezel-right{display:flex;align-items:center;gap:8px}
.bgm-toggle{
  padding:2px 8px;border:2px solid var(--ink);border-radius:999px;background:#fff9eb;
  font-size:10px;line-height:1.1;box-shadow:1px 1px 0 var(--ink);
}
.bgm-toggle.on{background:#e1f5dc;color:#234d1c}
.led{width:9px;height:9px;background:var(--green);border:2px solid var(--ink);border-radius:50%;display:inline-block}
.led.hot{background:var(--red);animation:blink .35s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}

.screen{
  flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 10px 10px;
  background:var(--cream);display:flex;flex-direction:column;scrollbar-width:none;position:relative;
}
.screen::-webkit-scrollbar{display:none}
.parchment-box{
  position:relative;overflow:hidden;
  flex:1;border:3px solid var(--ink);border-radius:14px;
  box-shadow:inset 0 0 0 3px var(--parchment-dark);
  background:rgba(253,246,231,.92);padding:9px;display:flex;flex-direction:column;
}

/* 溫馨像素廚房背景插畫層（柔和淡化，不干擾操作） */
.kitchen-wallpaper{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:.24;pointer-events:none;z-index:0;image-rendering:pixelated;
}
.views-wrap{
  display:flex;flex-direction:column;flex:1;position:relative;z-index:2;min-height:0;
}
.view{display:none;flex-direction:column;flex:1;position:relative;z-index:2;min-height:0}
.view.active{display:flex;animation:popIn .2s steps(3)}
@keyframes popIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* 電腦版寬螢幕（>=900px）：左右雙欄同時顯示烹飪區與上菜區 */
@media (min-width:900px){
  .phone{
    width:868px;height:min(810px,calc(100vh - 20px));
  }
  .views-wrap{
    display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:stretch;
  }
  .view{
    display:flex !important;
  }
  #serveView{
    border-left:3px dashed rgba(66,39,24,.35);
    padding-left:14px;
  }
}

/* 頂部標題區（保留原版圓形Logo、COOK廚師帽、地點、圖鑑按鈕） */
.top-row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.logo-circle{
  width:46px;height:46px;flex:none;border:3px solid var(--ink);border-radius:50%;
  background:#fff8e8;box-shadow:inset -2px 2px 0 var(--parchment-dark),2px 3px 0 var(--ink);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.logo-circle .px-art{width:34px;height:34px}
.title-center{flex:1;text-align:center}
.cook-sub{
  display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:900;
  color:var(--olive);letter-spacing:1px;background:#fff8e8;padding:1px 8px;
  border:2px solid var(--ink);border-radius:999px;
}
.cook-sub .px-art{width:15px;height:15px}
.main-title{font-size:18px;font-weight:900;letter-spacing:1px;text-shadow:2px 2px 0 var(--parchment-dark);cursor:pointer;margin-top:2px}
.loc-btn{
  margin-top:3px;padding:3px 10px;border:2.5px solid var(--ink);border-radius:999px;background:#fff9ec;
  box-shadow:2px 2px 0 var(--ink);font-size:11px;display:inline-flex;align-items:center;gap:4px;
}
.loc-btn:active{transform:translate(1px,1px);box-shadow:none}
.book-btn{
  height:40px;padding:0 10px;flex:none;border:3px solid var(--ink);border-radius:12px;background:#ffe9c2;
  box-shadow:inset -2px 2px 0 #e6bd7a,inset 2px 2px 0 #fff,2px 3px 0 var(--ink);
  font-size:12px;display:flex;align-items:center;gap:4px;
}
.book-btn:active{transform:translate(2px,2px);box-shadow:none}

/* 實線引導提示框 */
.hint-bar{
  margin-top:7px;padding:6px 9px;border:2.5px solid var(--ink);border-radius:10px;background:#fffcf2;
  box-shadow:2px 2px 0 var(--ink);font-size:11.5px;font-weight:800;text-align:center;line-height:1.35;
}
.hint-bar.orange{background:#fde7c2;border-color:var(--ink);color:#7c3a06}
.hint-bar.green{background:#dff2d8;border-color:var(--ink);color:#1f4d18}
.hint-bar.red{background:#fad7d4;border-color:var(--ink);color:#7a1c15}

/* 上排 4 格不重複 Jackpot 拉霸架（僅能點擊此處選取與取消食材） */
.shelf{
  margin-top:8px;padding:7px;background:rgba(244,230,200,.92);border:3px solid var(--ink);
  border-radius:14px;box-shadow:inset 0 2px 0 #fff8e6,2px 3px 0 var(--ink);
}
.reels-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.reel{
  --h:82px;height:var(--h);border:3px solid var(--ink);border-radius:12px;background:#fffef9;
  box-shadow:inset 0 -3px 0 var(--parchment-dark),2px 3px 0 var(--ink);
  overflow:hidden;position:relative;cursor:pointer;user-select:none;transition:transform .12s,background .12s;
}
.reel:hover{background:#fff;transform:translateY(-2px)}
.reel.selected{
  background:#e4f7dc;border-color:#265e1d;
  box-shadow:inset 0 0 0 2.5px var(--green),2px 3px 0 var(--ink);
}
.reel.selected::after{
  content:"✓已放";position:absolute;top:2px;right:3px;background:var(--green);color:#fff;
  font-size:9px;font-weight:900;padding:1px 5px;border:1.5px solid var(--ink);border-radius:999px;z-index:3;
}
.strip{will-change:transform;transition:transform .78s cubic-bezier(.16,.88,.28,1.03)}
.strip.instant{transition:none}
.cell{height:var(--h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.cell .px-art{width:48px;height:48px}
.cell span{
  font-size:10.5px;font-weight:900;background:#fff4d9;border:1.5px solid var(--ink);
  border-radius:999px;padding:0 6px;line-height:1.25;
}
.cell.mystery-cell .q-mark{
  width:44px;height:44px;border:2.5px dashed var(--olive);border-radius:12px;
  background:#fff8e6;display:flex;align-items:center;justify-content:center;
  font-size:24px;font-weight:900;color:var(--olive);
}

/* 中央主舞台：可愛大拉桿 + 圓潤大燉鍋 + 溫度計與實線開關 */
.stage{
  flex:1;margin-top:8px;display:grid;grid-template-columns:56px 1fr 66px;
  gap:6px;align-items:center;min-height:282px;
}
.lever-col{display:flex;flex-direction:column;align-items:center;gap:6px}
.lever-btn{
  width:52px;height:164px;border:3px solid var(--ink);border-radius:16px;background:#fff3d6;
  box-shadow:inset -3px 3px 0 var(--parchment-dark),inset 2px 2px 0 #fff,3px 3px 0 var(--ink);
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:10px 0;
}
.lever-btn:active{transform:translate(1px,1px)}
.lever-track{position:absolute;top:20px;bottom:20px;width:12px;background:#7d5e49;border:2.5px solid var(--ink);border-radius:999px}
.lever-knob{
  position:relative;z-index:2;width:34px;height:34px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#ffb3aa,var(--red) 72%);
  border:3px solid var(--ink);box-shadow:0 2px 0 var(--ink);transition:transform .35s steps(5);
}
.lever-btn.pulling .lever-knob{transform:translateY(104px)}
.lever-tag{
  font-size:10.5px;font-weight:900;text-align:center;line-height:1.2;color:var(--ink);
  background:#fff8e8;border:2px solid var(--ink);border-radius:8px;padding:2px 5px;
}

.pot-stage{
  height:100%;border:none;background:transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;padding:2px;
}
.steam-box{height:28px;display:flex;gap:18px;align-items:flex-end;opacity:0;transition:opacity .2s}
.pot-unit.cooking .steam-box{opacity:1}
.steam-puff{width:13px;height:13px;background:#fff;border:2.5px solid var(--ink);border-radius:50%;animation:steamUp 1.1s steps(4) infinite}
.steam-puff:nth-child(2){animation-delay:.35s;width:16px;height:16px}
.steam-puff:nth-child(3){animation-delay:.7s}
.pot-unit.burnt .steam-puff{background:#3a353f;border-color:var(--ink)}
@keyframes steamUp{0%{transform:translateY(8px);opacity:.95}100%{transform:translateY(-20px);opacity:0}}
.pot-unit{display:flex;flex-direction:column;align-items:center;position:relative}
.pot-lid-wrap{width:176px;height:54px;z-index:3;transition:transform .42s cubic-bezier(.34,1.56,.64,1);transform-origin:14px 44px}
.pot-lid-wrap .px-art{width:100%;height:100%}
.pot-unit.cooking .pot-lid-wrap{animation:lidBounce .42s steps(2) infinite alternate}
@keyframes lidBounce{from{transform:translateY(0)}to{transform:translateY(-4px) rotate(-2deg)}}
.pot-unit.opening .pot-lid-wrap{transform:translate(-18px,-30px) rotate(-26deg)}
.pot-burst{
  position:absolute;top:16px;width:130px;height:52px;pointer-events:none;opacity:0;z-index:4;
  background:radial-gradient(circle,rgba(255,243,148,.95) 0%,rgba(255,194,107,.55) 45%,transparent 72%);
}
.pot-unit.opening .pot-burst{animation:burstPop .45s steps(3) forwards}
@keyframes burstPop{0%{opacity:0;transform:scale(.5)}45%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:scale(1.3)}}

.pot-body-wrap{width:176px;height:116px;margin-top:-9px;position:relative;z-index:2}
.pot-body-wrap .px-art{width:100%;height:100%}
.pot-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:10px;pointer-events:none}
.pot-icons{display:grid;grid-template-columns:repeat(2,34px);gap:3px;min-height:70px;align-items:center;justify-items:center}
.pot-icons .px-art{width:34px;height:34px;animation:dropIn .24s steps(3)}
@keyframes dropIn{from{transform:translateY(-14px) scale(1.2);opacity:0}to{transform:none;opacity:1}}
.pot-unit.shake{animation:potShake .26s steps(2) infinite}
.pot-unit.sizzle{animation:potShake .12s steps(2) infinite}
@keyframes potShake{0%{transform:translateX(-2.5px)}100%{transform:translateX(2.5px)}}
.pot-unit.burnt .pot-body-wrap .px-art,
.pot-unit.burnt .pot-lid-wrap .px-art{filter:grayscale(1) brightness(.22) contrast(1.4)}
.pot-unit.burnt .pot-icons .px-art{filter:grayscale(1) brightness(.18) contrast(1.5)}
.pot-unit.warn .pot-body-wrap{animation:blink .28s steps(2) infinite}

.stove-base{
  width:214px;height:40px;margin-top:-5px;z-index:1;background:#68737d;border:3px solid var(--ink);
  border-radius:10px;box-shadow:inset 0 4px 0 #9aa6b2,3px 3px 0 var(--ink);
  display:flex;align-items:center;justify-content:center;gap:16px;
}
.flame{width:16px;height:16px;background:var(--orange);border:2px solid var(--ink);border-radius:3px;transform:rotate(45deg);opacity:.22}
.pot-unit.cooking .flame{opacity:1;background:#ffd447;box-shadow:0 0 0 2.5px var(--red);animation:flameFlicker .2s steps(2) infinite alternate}
@keyframes flameFlicker{from{transform:rotate(45deg) scale(.92)}to{transform:rotate(45deg) scale(1.22)}}

/* 右側溫度計與實線開關火按鈕 */
.right-col{display:flex;flex-direction:column;align-items:center;gap:9px}
.thermo-box{
  width:58px;border:3px solid var(--ink);border-radius:14px;background:#fff6e0;
  box-shadow:inset -2px 2px 0 var(--parchment-dark),3px 3px 0 var(--ink);
  padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:4px;
}
.thermo-tube{width:24px;height:112px;border:2.5px solid var(--ink);border-radius:999px;background:#fffef9;position:relative;overflow:hidden}
.thermo-fill{position:absolute;left:0;right:0;bottom:0;height:0%;background:#f5b82e;transition:height .2s linear,background .2s}
.thermo-box.ready .thermo-fill{background:var(--green)}
.thermo-box.hot .thermo-fill{background:var(--red)}
.line-burn{position:absolute;left:0;right:0;top:10%;border-top:2px solid var(--red)}
.line-done{position:absolute;left:0;right:0;top:25%;border-top:2px solid var(--green)}
.thermo-txt{font-size:11px;font-weight:900}

.fire-switch{
  width:58px;height:66px;border:3px solid var(--ink);border-radius:14px;background:#dfe6ed;
  box-shadow:inset -2px 2px 0 #9aa6b2,3px 3px 0 var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:5px 2px;
  font-size:11px;font-weight:900;
}
.fire-switch .knob{width:40px;height:20px;background:#fff;border:2.5px solid var(--ink);border-radius:8px}
.fire-switch.on{background:var(--red);color:#fff;box-shadow:inset 2px 2px 0 #8c231c,3px 3px 0 var(--ink)}
.fire-switch.on .knob{order:-1;background:#ffdf73}

/* 底部實線操作按鈕區 */
.bottom-btns{margin-top:8px;display:grid;grid-template-columns:1fr 1.35fr;gap:9px}
.px-btn{
  height:48px;border:3px solid var(--ink);border-radius:14px;background:#fff2d6;
  box-shadow:inset -2px 2px 0 var(--parchment-dark),inset 2px 2px 0 #fff,3px 3px 0 var(--ink);
  font-size:15px;font-weight:900;letter-spacing:1px;
}
.px-btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:none}
.px-btn.plate{background:#e4f2dc;color:#1f4d18}
.px-btn.plate.ready{background:var(--green);color:#fff;animation:pulseBtn .65s steps(2) infinite alternate}
@keyframes pulseBtn{from{transform:scale(1)}to{transform:scale(1.03)}}

/* ===== 第二畫面：Gacha 轉蛋發光大圓盤料理展示 ===== */
.serve-top{margin-top:6px;display:flex;justify-content:flex-start}
.rating-box{
  padding:7px 14px;border:3px solid var(--ink);border-radius:14px;background:#dff2d8;
  box-shadow:3px 3px 0 var(--ink);display:inline-flex;flex-direction:column;align-items:flex-start;gap:2px;
  transition:background .2s;
}
.rating-box.mystery{background:#f4e6c8}
.rating-box.death{background:#3b3640;color:#f4f0f8}
.serve-status-line{
  font-size:13px;font-weight:900;color:#1f4d18;line-height:1.2;letter-spacing:.3px;
}
.rating-box.mystery .serve-status-line{color:var(--ink-soft)}
.rating-box.death .serve-status-line{color:#ffd666}
.stars-row{font-size:18px;letter-spacing:2px;color:#f5a623;text-shadow:1.5px 1.5px 0 var(--ink);line-height:1.15}
.stars-row.mystery{color:var(--ink-soft);text-shadow:none;letter-spacing:3px;font-weight:900;font-size:15px}

.plate-showcase{
  flex:1;min-height:290px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:2px 0;position:relative;
}
.gacha-aura{
  position:absolute;width:316px;height:316px;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,rgba(255,222,102,.65) 0deg 14deg,rgba(255,255,255,0) 14deg 28deg);
  animation:spinRays 9s linear infinite;pointer-events:none;transition:opacity .25s;
}
.gacha-aura.hidden{opacity:0}
.gacha-aura.death{
  background:repeating-conic-gradient(from 0deg,rgba(75,68,83,.55) 0deg 14deg,rgba(255,255,255,0) 14deg 28deg);
}
@keyframes spinRays{to{transform:rotate(360deg)}}
.pure-plate{position:relative;z-index:2;width:270px;height:270px;display:flex;align-items:center;justify-content:center}
.pure-plate .px-art{width:264px;height:264px;animation:dishPop .45s cubic-bezier(.34,1.56,.64,1)}
.pure-plate.empty-plate{
  width:210px;height:210px;border:3.5px dashed var(--olive);border-radius:50%;
  background:rgba(255,253,245,.75);box-shadow:inset 0 0 0 12px rgba(244,230,200,.6);
}
.empty-plate-hint{
  font-size:13px;font-weight:900;color:var(--olive);letter-spacing:1px;
  background:#fff8e8;padding:4px 12px;border:2px solid var(--olive);border-radius:999px;
}
@keyframes dishPop{0%{transform:scale(.35) rotate(-8deg);opacity:0}75%{transform:scale(1.06) rotate(2deg)}100%{transform:none;opacity:1}}
.used-ingredients{
  position:relative;z-index:2;margin-top:4px;padding:4px 10px;border:2px solid var(--ink);
  border-radius:999px;background:rgba(255,253,247,.92);display:flex;align-items:center;gap:6px;
}
.used-ingredients.hidden{display:none}
.used-ingredients .px-art{width:24px;height:24px}

.dialog-card{
  border:3px solid var(--ink);border-radius:16px;background:rgba(255,253,247,.96);
  box-shadow:inset 0 0 0 2.5px var(--parchment-dark),3px 4px 0 var(--ink);
  padding:10px 12px;display:flex;flex-direction:column;gap:6px;
}
.dish-head{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
.cuisine-tag{
  padding:3px 10px;border:2.5px solid var(--ink);border-radius:999px;
  background:#ffe2b3;color:#7c3a06;font-size:11.5px;font-weight:900;
}
.cuisine-tag.death{background:#3b3640;color:#f8f2e6}
.cuisine-tag.mystery{background:#f4e6c8;color:var(--ink-soft)}
.kcal-badge{
  padding:3px 10px;border:2.5px solid var(--ink);border-radius:999px;
  background:#fad7d4;color:#8c1d18;font-size:11.5px;font-weight:900;
}
.kcal-badge.mystery{background:#f4e6c8;color:var(--ink-soft)}
.dish-name{font-size:18px;font-weight:900;letter-spacing:.5px}
.dish-desc{font-size:12px;line-height:1.48;color:var(--ink-soft);font-weight:700}
.dialog-actions{display:grid;grid-template-columns:1fr 1.25fr;gap:8px;margin-top:4px}
.map-link{
  height:44px;border:3px solid var(--ink);border-radius:14px;background:#dce9f7;color:#1c4366;
  box-shadow:inset -2px 2px 0 #9dbad9,inset 2px 2px 0 #fff,2px 3px 0 var(--ink);text-decoration:none;
  font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:4px;
}
.map-link.disabled{
  pointer-events:none;opacity:.48;background:#e9e4d8;color:var(--ink-soft);
}
.map-link:active{transform:translate(2px,2px);box-shadow:none}

/* 彈窗：地區設定 & 可新增/刪除食譜圖鑑 */
.modal-mask{
  position:absolute;inset:0;background:rgba(66,39,24,.65);z-index:50;
  display:none;align-items:center;justify-content:center;padding:10px;
}
.modal-mask.open{display:flex}
.modal-box{
  width:100%;max-height:92%;background:var(--cream);border:4px solid var(--ink);border-radius:18px;
  box-shadow:6px 6px 0 var(--ink);padding:10px;display:flex;flex-direction:column;gap:8px;
}
.modal-head{display:flex;align-items:center;justify-content:space-between;border-bottom:2.5px solid var(--ink);padding-bottom:6px;gap:6px}
.modal-title{font-size:14.5px;font-weight:900}
.head-tools{display:flex;align-items:center;gap:5px}
.mini-action-btn{

<script>
/* ===== 0. 輕柔可愛 16-bit 音樂盒 BGM 與像素操作音效引擎 ===== */
const SoundFX = (() => {
  let ctx = null;
  let enabled = false;
  let bgmTimer = null;
  let step = 0;

  // 舒緩可愛的八音盒節拍（低音量不刺耳）
  const melody = [
    523.25, 0, 659.25, 783.99, 659.25, 0, 587.33, 659.25,
    523.25, 0, 440.00, 523.25, 392.00, 0, 440.00, 493.88,
    523.25, 0, 659.25, 783.99, 880.00, 0, 783.99, 659.25,
    587.33, 0, 659.25, 587.33, 523.25, 0, 0, 0
  ];
  const bass = [
    261.63, 0, 196.00, 0, 220.00, 0, 174.61, 0,
    261.63, 0, 196.00, 0, 196.00, 0, 246.94, 0,
    261.63, 0, 196.00, 0, 220.00, 0, 174.61, 0,
    196.00, 0, 196.00, 0, 261.63, 0, 0, 0
  ];

  function ensureCtx() {
    if (!ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) ctx = new AudioCtx();
    }
    if (ctx && ctx.state === 'suspended') ctx.resume();
  }

  function tone(freq, dur, type = 'sine', vol = 0.03, delay = 0) {
    if (!enabled || !ctx || !freq) return;
    const now = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.linearRampToValueAtTime(vol, now + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + dur + 0.02);
  }

  function startBgmLoop() {
    if (bgmTimer) return;
    bgmTimer = setInterval(() => {
      if (!enabled) return;
      const m = melody[step % melody.length];
      const b = bass[step % bass.length];
      if (m) tone(m, 0.28, 'sine', 0.022);
      if (b) tone(b, 0.34, 'triangle', 0.018);
      step++;
    }, 290);
  }

  function setEnabled(val) {
    enabled = val;
    const btn = document.getElementById('bgmBtn');
    if (enabled) {
      ensureCtx();
      startBgmLoop();
      if (btn) { btn.textContent = '♪ BGM 開'; btn.classList.add('on'); }
    } else {
      if (btn) { btn.textContent = '♪ BGM 關'; btn.classList.remove('on'); }
    }
  }

  function autoUnlock() {
    if (!enabled) setEnabled(true);
  }

  return {
    toggle() { setEnabled(!enabled); },
    autoUnlock,
    click() { tone(660, 0.07, 'sine', 0.045); },
    drop() { tone(440, 0.08, 'triangle', 0.06, 0); tone(659.25, 0.12, 'triangle', 0.06, 0.06); },
    remove() { tone(523.25, 0.07, 'triangle', 0.05, 0); tone(392, 0.1, 'triangle', 0.05, 0.05); },
    spinTick(i) { tone(480 + i * 75, 0.07, 'sine', 0.04); },
    fireOn() { tone(330, 0.09, 'triangle', 0.05, 0); tone(493.88, 0.14, 'triangle', 0.05, 0.07); },
    warn() { tone(880, 0.08, 'sine', 0.045, 0); tone(880, 0.08, 'sine', 0.045, 0.12); },
    win() {
      [523.25, 659.25, 783.99, 1046.5].forEach((f, idx) => tone(f, 0.22, 'triangle', 0.055, idx * 0.09));
    },
    death() {
      [311.13, 277.18, 233.08, 185.0].forEach((f, idx) => tone(f, 0.24, 'sawtooth', 0.032, idx * 0.1));
    }
  };
})();

/* ===== 1. 高精細離屏 Canvas 16-bit 可愛像素渲染引擎 ===== */
const PAL = {
  k:'#422718', w:'#ffffff', w1:'#f8f2e6', w2:'#e4d6bc',
  r1:'#ff9b8f', r2:'#e3594d', r3:'#b53328', r4:'#781d15',
  o1:'#ffc26b', o2:'#ed832b', o3:'#bd5615',
  y1:'#fff394', y2:'#f7c93e', y3:'#cf9417', y4:'#916009',
  g1:'#a5e675', g2:'#5eb041', g3:'#357526', g4:'#1f4a16',
  b1:'#96ccf2', b2:'#4e8ec4', b3:'#2b5982',
  br1:'#d4965f', br2:'#a36534', br3:'#703f1a', br4:'#4a250c',
  s1:'#d8dfe6', s2:'#a3aeb8', s3:'#68737d',
  p1:'#c995ed', p2:'#8f50bd', p3:'#522475',
  pk:'#ffb5c5'
};
const SPRITES = {};

function makeSprite(w, h, fn) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  const px = (x, y, col) => {
    if (!PAL[col] || x < 0 || y < 0 || x >= w || y >= h) return;
    ctx.fillStyle = PAL[col];
    ctx.fillRect(x | 0, y | 0, 1, 1);
  };
  const rect = (x, y, rw, rh, col) => {
    if (!PAL[col]) return;
    ctx.fillStyle = PAL[col];
    ctx.fillRect(x | 0, y | 0, rw | 0, rh | 0);
  };
  const ell = (cx, cy, rx, ry, col) => {
    for (let y = Math.floor(cy - ry - 1); y <= Math.ceil(cy + ry + 1); y++) {
      for (let x = Math.floor(cx - rx - 1); x <= Math.ceil(cx + rx + 1); x++) {
        if (((x + .5 - cx) / rx) ** 2 + ((y + .5 - cy) / ry) ** 2 <= 1) px(x, y, col);
      }
    }
  };
  const outline = (k = 'k') => {
    const d = ctx.getImageData(0, 0, w, h).data, pts = [];
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        if (d[(y * w + x) * 4 + 3] === 0 && [[-1,0],[1,0],[0,-1],[0,1]].some(([dx, dy]) => {
          const nx = x + dx, ny = y + dy;
          return nx >= 0 && ny >= 0 && nx < w && ny < h && d[(ny * w + nx) * 4 + 3] > 0;
        })) pts.push([x, y]);
      }
    }
    pts.forEach(([x, y]) => px(x, y, k));
  };
  fn({ px, rect, ell, outline });
  return c.toDataURL('image/png');
}

function buildKitchenWallpaper() {
  return makeSprite(120, 180, ({ rect, ell, px }) => {
    // 柔和白瓷磚牆面
    rect(0, 0, 120, 96, 'w1');
    for (let y = 12; y < 96; y += 12) rect(0, y, 120, 1, 'w2');
    for (let y = 0; y < 96; y += 12) {
      const offset = (y / 12) % 2 === 0 ? 0 : 12;
      for (let x = offset; x < 120; x += 24) rect(x, y, 1, 12, 'w2');
    }
    // 上層木架與調味罐
    rect(6, 22, 46, 4, 'br2'); rect(8, 26, 42, 2, 'br3');
    rect(12, 11, 8, 11, 'o1'); rect(13, 9, 6, 2, 'r2');
    rect(24, 13, 7, 9, 'g1'); rect(25, 11, 5, 2, 'y2');
    rect(36, 10, 9, 12, 'b1'); rect(37, 8, 7, 2, 'w');
    // 右側掛桿與鍋鏟湯勺
    rect(72, 16, 40, 2, 's3');
    rect(80, 18, 2, 14, 'br2'); ell(81, 34, 4, 3, 's2');
    rect(96, 18, 2, 13, 'br2'); rect(94, 31, 6, 6, 's2');
    // 灶台木檯面（參考插畫風格：木勺筒、圓麵包、番茄、香草盆栽、電鍋）
    rect(0, 92, 120, 14, 'br1');
    rect(0, 92, 120, 2, 'y1');
    rect(0, 106, 120, 5, 'br3');
    // 木勺筒
    rect(6, 76, 10, 16, 'b2'); rect(8, 67, 2, 9, 'br1'); rect(12, 69, 2, 7, 'br2');
    // 金黃圓麵包
    ell(28, 85, 10, 7, 'o1'); ell(27, 83, 7, 4, 'y1');
    // 紅番茄與青菜
    ell(45, 88, 5, 4, 'r2'); px(45, 84, 'g2');
    ell(54, 89, 4, 3, 'r3'); px(54, 86, 'g2');
    ell(68, 84, 8, 6, 'g2'); ell(66, 82, 5, 4, 'g1');
    // 香草小盆栽
    rect(80, 82, 10, 10, 'o2'); ell(85, 78, 7, 5, 'g2'); ell(84, 76, 4, 3, 'g1');
    // 可愛藍色電鍋
    rect(95, 72, 19, 20, 'b2'); rect(97, 74, 15, 4, 'b1'); rect(94, 70, 21, 3, 's1');

/* ===== 3. 遊戲狀態與核心控制 ===== */
const $ = id => document.getElementById(id);
const STORAGE_KEY = 'mineral_kitchen_recipes_v3';

function loadRecipes() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed) && parsed.length > 0) return parsed;
    }
  } catch (e) {}
  return JSON.parse(JSON.stringify(DEFAULT_RECIPES));
}

function saveRecipes(list) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); } catch (e) {}
}

let RECIPES = loadRecipes();

const state = {
  location: '台北市文山區',
  reels: [0, 4, 7, 13],
  reelsRolled: false, // 尚未拉動拉桿前顯示「？」神秘卡
  panItems: [], // 儲存 { item, fromReel }，拉動轉盤時不會清空鍋內已選食材！
  firing: false,
  temp: 0,
  burnt: false,
  warned: false,
  spinning: false,
  timer: null,
  bookCat: 'ALL',
  pickedNewIngs: [],
  hasServedDish: false
};

function setHint(text, tone = '') {
  const el = $('hintBar');
  el.textContent = text;
  el.className = 'hint-bar' + (tone ? ' ' + tone : '');
}

/* 抽取 4 個彼此完全不重複、且盡量避開鍋中已有食材的索引 */
function getUniqueFourReels(excludeIds = []) {
  const allIndices = INGREDIENTS.map((_, i) => i);
  const preferred = allIndices.filter(i => !excludeIds.includes(INGREDIENTS[i].id));
  const pool = preferred.length >= 4 ? preferred : allIndices;
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool.slice(0, 4);
}

function initReels() {
  const grid = $('reelsGrid');
  grid.innerHTML = '';
  const initialFour = getUniqueFourReels();
  state.reels = initialFour;
  state.reelsRolled = false;

  for (let i = 0; i < 4; i++) {
    const reel = document.createElement('div');
    reel.className = 'reel';
    const strip = document.createElement('div');
    strip.className = 'strip';
    strip.innerHTML =
      `<div class="cell mystery-cell"><div class="q-mark">?</div><span>待轉出</span></div>` +
      [...INGREDIENTS, ...INGREDIENTS]
        .map(it => `<div class="cell">${imgTag(it.sprite, it.name)}<span>${it.name}</span></div>`)
        .join('');
    reel.appendChild(strip);
    grid.appendChild(reel);
    setMysteryStrip(i);

    // 僅允許點擊上方 4 個食材格來加入或取消該食材
    reel.addEventListener('click', () => {
      SoundFX.autoUnlock();
      toggleIngredientFromReel(i);
    });
  }
}

function setMysteryStrip(reelIdx) {
  const strip = $('reelsGrid').children[reelIdx]?.querySelector('.strip');
  if (!strip) return;
  strip.classList.add('instant');
  strip.style.transform = 'translateY(0px)';
}

function positionStrip(reelIdx, itemIdx, instant = false) {
  const strip = $('reelsGrid').children[reelIdx]?.querySelector('.strip');
  if (!strip) return;
  strip.classList.toggle('instant', instant);
  strip.style.transform = `translateY(-${(itemIdx + 1) * 82}px)`;
}

/* 拉動左側拉桿：保留鍋裡已選的食材，並為上方轉出 4 種全新的不重複食材 */
function spinReels() {
  SoundFX.autoUnlock();
  if (state.spinning) return;
  if (state.firing) return setHint('請先關火再拉動食材轉盤喔！', 'orange');
  if (state.burnt) return setHint('鍋子燒焦啦！請先點擊「清空重來」清洗鍋具。', 'red');

  state.spinning = true;
  clearPreviousServedDish();
  updateReelsUI();
  $('leverBtn').classList.add('pulling');
  const keptCount = state.panItems.length;
  setHint(
    keptCount > 0
      ? `喀啦喀啦！保留鍋內 ${keptCount} 種食材，正在抽取其他新食材...`
      : '喀啦喀啦！正在抽取 4 種不重複的新鮮食材...',
    'orange'
  );

  const inPotIds = state.panItems.map(e => e.item.id);
  const nextFour = getUniqueFourReels(inPotIds);

  for (let i = 0; i < 4; i++) {
    const target = nextFour[i];
    state.reels[i] = target;
    positionStrip(i, 0, true);
    setTimeout(() => {
      SoundFX.spinTick(i);
      requestAnimationFrame(() => requestAnimationFrame(() => positionStrip(i, INGREDIENTS.length + target, false)));
    }, i * 110);
  }

  setTimeout(() => {
    $('leverBtn').classList.remove('pulling');
    state.spinning = false;
    state.reelsRolled = true;
    for (let i = 0; i < 4; i++) positionStrip(i, state.reels[i], true);
    updateReelsUI();
    setHint(
      keptCount > 0
        ? `抽好啦！鍋內已有 ${keptCount} 種食材，可繼續點擊加入新食材或直接開火！`
        : '抽好啦！點擊上方食材格放入燉鍋（再點一次可取消）！',
      'green'
    );
  }, 1150);
}

function updatePotUI() {
  const iconsEl = $('potIcons');
  const serveBtn = $('serveBtn');

  if (state.panItems.length === 0) {
    iconsEl.innerHTML = '';
  } else {
    iconsEl.innerHTML = state.panItems.map(entry => imgTag(entry.item.sprite, entry.item.name)).join('');
  }

  // 只要鍋中有食材，隨時皆可點擊「起鍋盛盤」（未熟或燒焦會出紫色死神料理）
  const hasItems = state.panItems.length > 0;
  serveBtn.disabled = !hasItems;
  const isPerfect = hasItems && state.temp >= 75 && state.temp < 100 && !state.burnt;
  serveBtn.classList.toggle('ready', isPerfect);
}

function updateReelsUI() {
  const reels = $('reelsGrid').children;
  const inPotIds = new Set(state.panItems.map(e => e.item.id));
  for (let i = 0; i < 4; i++) {
    if (!reels[i]) continue;
    if (!state.reelsRolled) {
      reels[i].classList.remove('selected');
      continue;
    }
    const currentItem = INGREDIENTS[state.reels[i]];
    const isSelected = currentItem && inPotIds.has(currentItem.id);
    reels[i].classList.toggle('selected', isSelected);
  }
}

/* 點擊上方 4 格：已選中則取消放回，未選中則加入鍋內（拉過轉盤後也能取消） */
function toggleIngredientFromReel(idx) {
  if (state.spinning) return;
  if (!state.reelsRolled) return setHint('請先拉動左側拉桿轉出食材喔！', 'orange');
  if (state.burnt) return setHint('鍋子燒焦啦！請先點擊「清空重來」清洗鍋具。', 'red');

  const item = INGREDIENTS[state.reels[idx]];
  if (!item) return;

  clearPreviousServedDish();

  const existingPotIdx = state.panItems.findIndex(e => e.item.id === item.id);
  if (existingPotIdx !== -1) {
    state.panItems.splice(existingPotIdx, 1);
    SoundFX.remove();
    updateReelsUI();
    updatePotUI();
    setHint(`已從燉鍋取出「${item.name}」（目前鍋內 ${state.panItems.length}/4 種）。`, '');
    return;
  }

  if (state.panItems.length >= 4) {
    return setHint('燉鍋最多只能放 4 種食材喔！可點擊已選食材格取消其中一種。', 'orange');
  }

  state.panItems.push({ item, fromReel: idx });
  SoundFX.drop();
  updateReelsUI();
  updatePotUI();
  if (!state.firing) {
    setHint(`已放入「${item.name}」（${state.panItems.length}/4）！可繼續拉轉盤找食材或開火。`, 'green');
  }
}

function toggleFire() {
  SoundFX.autoUnlock();
  if (state.spinning) return;
  if (!state.firing) {
    if (state.panItems.length === 0) return setHint('空鍋不能乾燒喔！請先點擊上方食材放入燉鍋。', 'orange');
    if (state.burnt) return setHint('這鍋已經燒焦了，請先「清空重來」再煮下一道！', 'red');
    clearPreviousServedDish();
    state.firing = true;
    SoundFX.fireOn();
    $('fireBtn').classList.add('on');
    $('powerLed').classList.add('hot');
    $('potUnit').classList.add('cooking', 'shake');
    setHint('大火烹煮中！熟度達 75%～99% 才能做出美味料理，未熟或 100% 會變死神料理！', 'orange');
    state.timer = setInterval(() => {
      state.temp = Math.min(100, state.temp + 2.5);
      updateThermoUI();
    }, 200);
  } else {
    stopFire();
    SoundFX.click();
    setHint(`已關火保溫（目前熟度 ${Math.round(state.temp)}%）。`, '');
  }
}

function stopFire() {
  state.firing = false;
  clearInterval(state.timer);
  state.timer = null;
  $('fireBtn').classList.remove('on');
  $('powerLed').classList.remove('hot');
  $('potUnit').classList.remove('cooking', 'shake', 'sizzle', 'warn');
}

function updateThermoUI() {
  const t = Math.round(state.temp);
  $('tempVal').textContent = `${t}°`;
  $('thermoFill').style.height = `${t}%`;

  const box = $('thermoBox');
  const pot = $('potUnit');
  box.classList.toggle('ready', t >= 75 && t < 90);
  box.classList.toggle('hot', t >= 90);

  if (t >= 75 && t < 90) {
    pot.classList.add('sizzle');
    setHint(`熟度 ${t}% 進入黃金綠色區間！現在點擊「起鍋盛盤」就能做出美味料理！`, 'green');
  } else if (t >= 90 && t < 100) {
    pot.classList.add('warn');
    if (!state.warned) {
      state.warned = true;
      SoundFX.warn();
    }
    setHint(`危險！熟度 ${t}% 進入紅色警戒線，快點「起鍋盛盤」或關火！`, 'red');
  } else if (t >= 100 && !state.burnt) {
    state.burnt = true;
    stopFire();
    pot.classList.add('burnt');
    SoundFX.death();
    setHint('慘了！煮到 100% 變成「紫色死神料理」了……盛盤看看結果或清空重來！', 'red');
  }
  updatePotUI();
}

/* 嚴格依據實際放入的食材精準匹配真實菜系與道地料理名稱（絕不出現「第15組」或生硬拼湊名稱） */
function matchDish() {
  const t = Math.round(state.temp);
  const panNames = state.panItems.map(e => e.item.name);

  if (state.burnt || t >= 100) {
    return {
      isDeathDish: true,
      cuisine: '暗黑死神料理',
      kcal: '???',
      title: '焦黑謎樣死神物質',
      sprite: 'dish_burnt',
      query: '附近餐廳 救命晚餐',
      desc: `因為烹煮時間過長（熟度 100%），鍋裡的【${panNames.join('、')}】已經融合成散發紫色毒霧的焦黑物質……今晚還是出門找間好餐廳比較安全！`
    };
  }

  if (t < 75) {
    return {
      isDeathDish: true,
      cuisine: '暗黑死神料理',
      kcal: '???',
      title: '半生不熟紫色死神鍋',
      sprite: 'dish_burnt',
      query: '附近餐廳 救命晚餐',
      desc: `火候還差得遠呢（目前熟度僅 ${t}%，未達 75% 黃金線）！鍋裡的【${panNames.join('、')}】生熟交雜散發出詭異紫光，記得開火煮熟再起鍋喔！`
    };
  }

  const ids = state.panItems.map(e => e.item.id);
  const exactCandidates = [];
  const partialCandidates = [];

  for (const r of RECIPES) {
    const req = r.required || [];
    const bonusPool = r.bonus || [];
    const allowedSet = new Set([...req, ...bonusPool]);

    const matchedReqCount = req.filter(k => ids.includes(k)).length;
    const hasAllRequired = matchedReqCount === req.length;
    const allPotItemsBelongToRecipe = ids.every(k => allowedSet.has(k));
    const bonusMatches = bonusPool.filter(k => ids.includes(k)).length;

    if (hasAllRequired && allPotItemsBelongToRecipe) {
      const score = req.length * 15 + bonusMatches * 5 - Math.abs(ids.length - req.length);
      exactCandidates.push({ recipe: r, score });
    } else if (hasAllRequired) {
      const score = req.length * 10 + bonusMatches * 3;
      partialCandidates.push({ recipe: r, score });
    }
  }

  if (exactCandidates.length > 0) {
    exactCandidates.sort((a, b) => b.score - a.score);
    return exactCandidates[0].recipe;
  }

  if (partialCandidates.length > 0) {
    partialCandidates.sort((a, b) => b.score - a.score);
    return partialCandidates[0].recipe;
  }

  // 針對特殊雙食材/多食材組合對應道地真實菜名、明確菜系與誘人介紹

function getStarRating(temp, isDeath) {
  if (isDeath) return '★☆☆☆☆';
  if (temp >= 78 && temp <= 88) return '★★★★★';
  if (temp >= 75 && temp <= 94) return '★★★★☆';
  return '★★★☆☆';
}

  state.hasServedDish = false;
  const box = $('ratingBox');

  stars.textContent = '???';
  stars.className = 'stars-row mystery';

  aura.className = 'gacha-aura hidden';
  plate.className = 'pure-plate empty-plate';
  plate.innerHTML = '<span class="empty-plate-hint">空盤待上菜</span>';
  usedRow.className = 'used-ingredients hidden';
  usedRow.innerHTML = '';

  cuisineEl.textContent = '????';

}

function clearPreviousServedDish() {
  if (state.hasServedDish) {
    setServeMysteryState();
  }
}

function serveDish() {
  SoundFX.autoUnlock();
  if (state.panItems.length === 0) return;
  stopFire();

  const pot = $('potUnit');
  pot.classList.add('opening');

  const dish = matchDish();
  const t = Math.round(state.temp);
  const isDeath = Boolean(dish.isDeathDish);

  if (isDeath) SoundFX.death();
  else SoundFX.win();

  setTimeout(() => {
    pot.classList.remove('opening');
    state.hasServedDish = true;

    const box = $('ratingBox');
    const badge = $('serveBadge');
    const stars = $('starRating');
    const aura = $('gachaAura');
    const plate = $('purePlateArt');
    const usedRow = $('usedIngRow');
    const cuisineEl = $('resCuisine');
    const kcalEl = $('resKcal');
    const mapLink = $('mapSearchLink');

    if (isDeath) {
      box.className = 'rating-box death';
      badge.textContent = t >= 100 ? '💀 100% 燒焦死神' : `💀 ${t}% 未熟死神`;
      aura.className = 'gacha-aura death';
      cuisineEl.className = 'cuisine-tag death';
    } else {
      box.className = 'rating-box';
      badge.textContent = `★ 黃金熟度 ${t}%`;
      aura.className = 'gacha-aura';
      cuisineEl.className = 'cuisine-tag';
    }

    stars.textContent = getStarRating(t, isDeath);
    stars.className = 'stars-row';
    $('serveLocText').textContent = state.location;

    plate.className = 'pure-plate';
    plate.innerHTML = imgTag(dish.sprite, dish.title);
    usedRow.className = 'used-ingredients';
    usedRow.innerHTML = state.panItems.map(e => imgTag(e.item.sprite, e.item.name)).join('');

    cuisineEl.textContent = dish.cuisine;
    kcalEl.textContent = `🔥 熱量：${dish.kcal} kcal`;
    kcalEl.className = 'kcal-badge';
    $('resDishName').textContent = dish.title;
    $('resDishDesc').textContent = dish.desc;
    mapLink.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(state.location + ' ' + dish.query)}`;
    mapLink.classList.remove('disabled');

    $('cookView').classList.remove('active');
    $('serveView').classList.add('active');
  }, 460);
}

function resetKitchen(autoSpin = false) {
  stopFire();
  state.panItems = [];
  state.temp = 0;
  state.burnt = false;
  state.warned = false;
  state.reelsRolled = false;
  state.hasServedDish = false;
  for (let i = 0; i < 4; i++) setMysteryStrip(i);
  $('potUnit').className = 'pot-unit';
  $('thermoBox').className = 'thermo-box';
  $('tempVal').textContent = '0°';
  $('thermoFill').style.height = '0%';
  updateReelsUI();
  updatePotUI();
  setServeMysteryState();
  setHint('拉動左側拉桿轉出 4 種不同食材，點擊上方食材格放入燉鍋！', '');
  if (autoSpin) spinReels();
}

        ${imgTag(r.sprite, r.title)}
        <div class="recipe-meta">
          <strong>${r.title}</strong>
          <button class="del-recipe-btn" type="button" data-del-idx="${idx}">🗑 刪除</button>
          <div class="recipe-tags">
            <span class="mini-tag">${r.cuisine}</span>
            <span class="mini-tag kcal">🔥 ${r.kcal} kcal</span>
            <span class="mini-tag">必備：${ingNames}</span>
          </div>
          <div>${r.desc}</div>
        </div>
      </div>
    `;
  }).join('');
}

function renderNewDishIngPicker() {
  const box = $('newDishIngPicker');
  box.innerHTML = INGREDIENTS.map(ing => {
    const picked = state.pickedNewIngs.includes(ing.id);
    return `<button type="button" class="ing-pick-btn ${picked ? 'picked' : ''}" data-ing-id="${ing.id}">${ing.name}</button>`;
  }).join('');
}

document.addEventListener('DOMContentLoaded', () => {
  buildAllSprites();
  $('kitchenBgImg').src = SPRITES.kitchenBg;
  $('logoChef').innerHTML = imgTag('chefHat', '廚師帽');
  $('serveLogoChef').innerHTML = imgTag('chefHat', '廚師帽');
  $('miniHat').innerHTML = imgTag('chefHat', 'COOK');
  $('potLidArt').innerHTML = imgTag('potLid', '鍋蓋');
  $('potBodyArt').innerHTML = imgTag('potBody', '燉鍋');

  initReels();
  updatePotUI();
  setServeMysteryState();
  renderBook();
  renderNewDishIngPicker();

  $('bgmBtn').addEventListener('click', () => SoundFX.toggle());
  $('leverBtn').addEventListener('click', spinReels);
  $('fireBtn').addEventListener('click', toggleFire);
  $('resetBtn').addEventListener('click', () => { SoundFX.click(); resetKitchen(false); });
  $('serveBtn').addEventListener('click', serveDish);
  $('quickCookTitle').addEventListener('click', () => { SoundFX.click(); resetKitchen(true); });

  $('backCookBtn').addEventListener('click', () => {
    SoundFX.click();
    $('serveView').classList.remove('active');
    $('cookView').classList.add('active');
    resetKitchen(false);
  });

  // 地區設定彈窗（雙畫面皆可開啟並自由輸入）
  const openLocModal = () => {
    SoundFX.click();
    $('locInput').value = state.location;
    $('locModal').classList.add('open');
  };
  $('openLocBtn').addEventListener('click', openLocModal);
  $('serveLocBtn').addEventListener('click', openLocModal);
  $('closeLocBtn').addEventListener('click', () => $('locModal').classList.remove('open'));
  document.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', () => { $('locInput').value = btn.dataset.loc; });
  });
  $('saveLocBtn').addEventListener('click', () => {
    const val = $('locInput').value.trim();
    if (val) {
      state.location = val;
      $('locText').textContent = val;
      $('serveLocText').textContent = val;
      $('locModal').classList.remove('open');
      SoundFX.click();
    }
  });

  // 食譜圖鑑彈窗（新增 / 刪除 / 篩選 / 恢復預設）
  const openBookModal = () => {
    SoundFX.click();
    renderBook();
    $('bookModal').classList.add('open');
  };
  $('openBookBtn').addEventListener('click', openBookModal);
  $('closeBookBtn').addEventListener('click', () => $('bookModal').classList.remove('open'));

  $('toggleAddFormBtn').addEventListener('click', () => {
    $('addDishForm').classList.toggle('open');
    SoundFX.click();
  });

  $('newDishIngPicker').addEventListener('click', e => {
    const btn = e.target.closest('.ing-pick-btn');
    if (!btn) return;
    const id = btn.dataset.ingId;
    const pos = state.pickedNewIngs.indexOf(id);
    if (pos !== -1) state.pickedNewIngs.splice(pos, 1);
    else if (state.pickedNewIngs.length < 4) state.pickedNewIngs.push(id);
    renderNewDishIngPicker();
    SoundFX.click();
  });

  $('saveNewDishBtn').addEventListener('click', () => {
    const title = $('newDishTitle').value.trim();
    if (!title) return;
    const reqs = state.pickedNewIngs.length > 0 ? [...state.pickedNewIngs] : ['egg'];
    const cuisine = $('newDishCuisine').value;
    const kcal = Math.max(50, Number($('newDishKcal').value) || 600);
    const sprite = $('newDishSprite').value;
    const desc = $('newDishDesc').value.trim() || `慢火細心烹調而成的招牌「${title}」，香氣四溢、美味滿分！`;

    RECIPES.unshift({
      cuisine,
      kcal,
      required: reqs,
      bonus: INGREDIENTS.map(i => i.id),
      title,
      sprite,
      query: title,
      desc
    });
    saveRecipes(RECIPES);
    $('newDishTitle').value = '';
    $('newDishDesc').value = '';
    state.pickedNewIngs = [];
    renderNewDishIngPicker();
    $('addDishForm').classList.remove('open');
    renderBook();
    SoundFX.win();
  });

  $('bookList').addEventListener('click', e => {
    const delBtn = e.target.closest('.del-recipe-btn');
    if (!delBtn) return;
    const idx = Number(delBtn.dataset.delIdx);
    if (!Number.isNaN(idx) && RECIPES[idx]) {
      RECIPES.splice(idx, 1);
      saveRecipes(RECIPES);
      renderBook();
      SoundFX.remove();
    }
  });

  $('restoreBookBtn').addEventListener('click', () => {
    RECIPES = JSON.parse(JSON.stringify(DEFAULT_RECIPES));
    saveRecipes(RECIPES);
    renderBook();
    SoundFX.click();
  });

  $('filterBar').addEventListener('click', e => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.bookCat = btn.dataset.cat;
    renderBook();
    SoundFX.click();
  });
});
</script>
</body>
</html>
